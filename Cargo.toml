[package]
name = "awaken"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.104"
ratatui = "0.30.2"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"

[provile.dev]
debug = 0
incremental = false

[profile.test]
debug = 0
incremental = false

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = true
